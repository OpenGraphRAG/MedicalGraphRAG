<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 健康知识推送</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diagnosis.css') }}">
</head>
<body>
    <div id="particles-js"></div>
    <div class="grid-overlay"></div>

    <!-- 统一导航栏 -->
    <nav class="health-nav">
        <div class="nav-logo"><i class="fas fa-brain"></i> AI 健康助手</div>
        <div class="nav-links">
            <a href="{{ url_for('health_profile') }}"><i class="fas fa-user-circle"></i> 健康画像</a>
            <a href="{{ url_for('diagnosis') }}" class="active"><i class="fas fa-magic"></i> 知识推送</a>
            <a href="{{ url_for('image_analysis') }}"><i class="fas fa-x-ray"></i> 影像分析</a>
            <a href="{{ url_for('profile_settings') }}"><i class="fas fa-cog"></i> 个人设置</a>
            <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </nav>

    <main class="main-container">
        <h1 class="neon-title animate__animated animate__pulse animate__infinite">💡 专属健康知识推送</h1>
        <p class="subtitle">直接点击即可基于您的健康画像生成个性化知识，也可输入具体问题获取针对性建议</p>

        <div class="diagnosis-panel glass">
            <section class="input-area">
                <label for="userInputText" class="floating-label">补充问题或描述（选填，不填则基于您的健康档案自动推送）</label>
                <textarea id="userInputText" placeholder="选填：如有具体问题可在此输入，例如：最近胸闷怎么办？高血压饮食注意什么？&#10;留空则直接基于您的完整健康画像推送个性化知识" maxlength="500"></textarea>
                <div class="char-count"><span id="charCount">0</span> / 500</div>
            </section>

            <section class="action-area">
                <button id="startDiagnosis" class="cyber-btn">
                    <i class="fas fa-bolt"></i>
                    <span>健康知识推送</span>
                </button>
            </section>

            <section class="output-area">
                <div id="typingIndicator" class="hidden">
                    <div class="spinner"></div>
                    <span>AI 正在分析中...</span>
                </div>
                <div id="outputContent" class="markdown-body animate__animated"></div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/diagnosis.js') }}"></script>
</body>
</html>
